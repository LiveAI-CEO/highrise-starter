name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GITHUB_PKG_AUTH_TOKEN: ${{ secrets.GHL_GITHUB_PKG_AUTH_TOKEN }}
      GOOGLE_PKG_AUTH_TOKEN: ${{ secrets.GHL_GOOGLE_PKG_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
